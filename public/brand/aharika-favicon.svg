      <stop offset="0.67" stop-color="var(--jelly-body-deep)"/>
      <stop offset="1" stop-color="var(--jelly-body-rim)"/>
    </radialGradient>
    <linearGradient id="favicon-bodyEdge" x1="215" y1="150" x2="735" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--jelly-outline-light)"/>
      <stop offset="0.55" stop-color="var(--jelly-outline)"/>
      <stop offset="1" stop-color="var(--jelly-outline-light)"/>
    </linearGradient>
    <radialGradient id="favicon-armFill" cx="0.45" cy="0.25" r="0.8">
      <stop offset="0" stop-color="var(--jelly-arm-light)"/>
      <stop offset="0.55" stop-color="var(--jelly-arm-mid)"/>
