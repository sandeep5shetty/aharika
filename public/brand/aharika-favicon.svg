<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 110 580 500" role="img" aria-label="Aharika">
  <style>
    :root {
      --jelly-body-top: #c9f7e8;
      --jelly-body-mid: #5ee0b0;
      --jelly-body-deep: #00bc7d;
      --jelly-body-rim: #9ef0c9;
      --jelly-outline: #2f9e6b;
      --jelly-outline-light: #4bc492;
      --jelly-arm-light: #b8f5d9;
      --jelly-arm-mid: #3dc992;
      --jelly-arm-deep: #1fa872;
      --jelly-cheek-light: #d4ffe8;
      --jelly-cheek: #7ee8b8;
      --jelly-cheek-deep: #5fd9b8;
      --jelly-eye-light: #1a3d2e;
      --jelly-eye: #0a1f16;
      --jelly-eye-deep: #05100c;
      --jelly-face-ink: #0a1f16;
      --jelly-shadow: #2f9e6b;
      --jelly-shadow-light: #4bc492;
      --jelly-eye-sparkle: #7ccf00;
    }
  </style>
  <defs>
